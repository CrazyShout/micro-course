<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Regression tree leaf means</title><desc id="d">Four artificial area and price pairs are split at area 2.5. Left leaf mean 110, right leaf mean 290; total within-leaf squared error 400.</desc><rect width="760" height="360" fill="#fbfcf8"/><g font-family="system-ui,sans-serif" fill="#17343b" text-anchor="middle"><text x="380" y="36" font-size="20">四条教学记录 / Four teaching records</text><text x="380" y="69" font-size="17">x (1000 sf): 1, 2, 3, 4　　y: 100, 120, 280, 300</text><rect x="262" y="95" width="236" height="54" rx="4" fill="#deeee6" stroke="#3e8877"/><text x="380" y="128" font-size="20">面积 / Area x ≤ 2.5 ?</text><path d="M320 149L190 209 M440 149L570 209" fill="none" stroke="#4c786a" stroke-width="2"/><text x="229" y="178" font-size="15">是 / Yes</text><text x="530" y="178" font-size="15">否 / No</text><rect x="70" y="210" width="240" height="85" rx="4" fill="#edf5f0" stroke="#92b8a6"/><rect x="450" y="210" width="240" height="85" rx="4" fill="#f6f0e3" stroke="#bbac85"/><text x="190" y="241" font-size="18">100, 120 → 均值 110</text><text x="570" y="241" font-size="18">280, 300 → 均值 290</text><text x="190" y="274" font-size="16">叶内 SSE = 200</text><text x="570" y="274" font-size="16">叶内 SSE = 200</text><text x="380" y="334" font-size="16">合计 / Total SSE = 400 · 价格单位：千美元 / Prices in $1000s</text></g></svg>
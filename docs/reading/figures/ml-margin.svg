<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Margin = the narrowest clearance</title><desc id="desc">Two classes on opposite sides of x1=0. Margin boundaries at x1=-1 and +1 give one-sided distance 1 and total width 2. Circles and squares distinguish classes.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="480" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Margin = the narrowest clearance</text><rect x="215" y="82" width="210" height="280" rx="0" fill="#e6f2ee" stroke="#d0e1da"/><line x1="215" y1="80" x2="215" y2="365" stroke="#60777a" stroke-width="3" stroke-dasharray="6 5"/><text x="215" y="392" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">f = −1</text><line x1="320" y1="80" x2="320" y2="365" stroke="#087c75" stroke-width="3"/><text x="320" y="392" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">f = 0</text><line x1="425" y1="80" x2="425" y2="365" stroke="#60777a" stroke-width="3" stroke-dasharray="6 5"/><text x="425" y="392" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">f = +1</text><circle cx="110" cy="125" r="11" fill="#087c75" stroke="white" stroke-width="2"/><circle cx="145" cy="265" r="11" fill="#087c75" stroke="white" stroke-width="2"/><circle cx="215" cy="200" r="11" fill="#087c75" stroke="white" stroke-width="2"/><circle cx="170" cy="325" r="11" fill="#087c75" stroke="white" stroke-width="2"/><rect x="415" y="120" width="20" height="20" rx="2" fill="#a46517" stroke="#a46517"/><rect x="450" y="240" width="20" height="20" rx="2" fill="#a46517" stroke="#a46517"/><rect x="500" y="310" width="20" height="20" rx="2" fill="#a46517" stroke="#a46517"/><rect x="540" y="175" width="20" height="20" rx="2" fill="#a46517" stroke="#a46517"/><line x1="220" y1="290" x2="315" y2="290" stroke="#60777a" stroke-width="2"/><line x1="325" y1="290" x2="420" y2="290" stroke="#60777a" stroke-width="2"/><text x="270" y="280" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">1</text><text x="371" y="280" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">1</text><text x="320" y="440" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">w = (1, 0), b = 0 → total width = 2</text></g></svg>

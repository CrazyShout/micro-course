<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445" role="img" aria-labelledby="title desc"><title id="title">Scaling changes what “near” means</title><desc id="desc">Raw Euclidean distances favor B; feature-wise scaling by 10 and 1000 favors A. Each panel has equal x and y units internally, with different scales between panels.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="445" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Scaling changes what “near” means</text><text x="175" y="90" font-size="22" fill="#17343b" text-anchor="middle" font-weight="700">Raw features</text><text x="470" y="90" font-size="22" fill="#17343b" text-anchor="middle" font-weight="700">x₁ / 10, x₂ / 1000</text><line x1="70" y1="320" x2="285" y2="320" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="70" y1="320" x2="70" y2="110" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="70" cy="320" r="8" fill="#17343b" stroke="white" stroke-width="2"/><text x="52" y="345" font-size="19" fill="#17343b" text-anchor="start" font-weight="400">q</text><line x1="370" y1="320" x2="585" y2="320" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="370" y1="320" x2="370" y2="110" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="370" cy="320" r="8" fill="#17343b" stroke="white" stroke-width="2"/><text x="352" y="345" font-size="19" fill="#17343b" text-anchor="start" font-weight="400">q</text><circle cx="72" cy="120" r="9" fill="#087c75" stroke="white" stroke-width="2"/><text x="87" y="130" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">A (1,100)</text><circle cx="78" cy="320" r="9" fill="#a46517" stroke="white" stroke-width="2"/><text x="104" y="306" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">B (4,0)</text><circle cx="420" cy="270" r="9" fill="#087c75" stroke="white" stroke-width="2"/><text x="431" y="259" font-size="19" fill="#17343b" text-anchor="start" font-weight="400">A (0.1,0.1)</text><circle cx="570" cy="320" r="9" fill="#a46517" stroke="white" stroke-width="2"/><text x="480" y="350" font-size="19" fill="#17343b" text-anchor="start" font-weight="400">B (0.4,0)</text><line x1="370" y1="320" x2="420" y2="270" stroke="#087c75" stroke-width="2" stroke-dasharray="6 5"/><text x="168" y="390" font-size="22" fill="#a46517" text-anchor="middle" font-weight="700">B is nearer</text><text x="478" y="390" font-size="22" fill="#087c75" text-anchor="middle" font-weight="700">A is nearer</text><text x="320" y="424" font-size="20" fill="#60777a" text-anchor="middle" font-weight="400">Distances: 100.005 vs 4 → 0.141 vs 0.4</text></g></svg>

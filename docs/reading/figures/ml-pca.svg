<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" aria-labelledby="title desc"><title id="title">PCA: project, then reconstruct</title><desc id="desc">Projection onto the diagonal retains (1,1) and maps (1,-1) to the origin. A centered data cloud illustrates the high-variance direction; labels need not follow this direction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="490" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">PCA: project, then reconstruct</text><line x1="112.0" y1="270" x2="528.0" y2="270" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="432.5" x2="320" y2="94.5" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="157.5" y1="432.5" x2="482.5" y2="107.5" stroke="#087c75" stroke-width="3"/><circle cx="190" cy="374.0" r="7" fill="#96beb4" stroke="white" stroke-width="2"/><circle cx="229.0" cy="380.5" r="7" fill="#96beb4" stroke="white" stroke-width="2"/><circle cx="281.0" cy="289.5" r="7" fill="#96beb4" stroke="white" stroke-width="2"/><circle cx="346.0" cy="231.0" r="7" fill="#96beb4" stroke="white" stroke-width="2"/><circle cx="417.5" cy="192.0" r="7" fill="#96beb4" stroke="white" stroke-width="2"/><circle cx="450" cy="127.0" r="7" fill="#96beb4" stroke="white" stroke-width="2"/><circle cx="385" cy="205" r="10" fill="#087c75" stroke="white" stroke-width="2"/><text x="406" y="212" font-size="20" fill="#087c75" text-anchor="start" font-weight="400">(1,1) kept</text><circle cx="385" cy="335" r="10" fill="#a46517" stroke="white" stroke-width="2"/><line x1="385" y1="335" x2="320" y2="270" stroke="#a46517" stroke-width="2" stroke-dasharray="6 5"/><text x="398" y="345" font-size="20" fill="#a46517" text-anchor="start" font-weight="400">(1,−1) → (0,0)</text><text x="480" y="93" font-size="20" fill="#087c75" text-anchor="middle" font-weight="400">v = (1,1)/√2</text><text x="320" y="463" font-size="21" fill="#60777a" text-anchor="middle" font-weight="400">High variance does not guarantee useful labels.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">One message, two representations</title><desc id="desc">The same message maps to presence or token counts. Absence contributes in Bernoulli NB; counts weight token log probabilities in multinomial NB.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="450" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">One message, two representations</text><rect x="150" y="70" width="340" height="56" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="320.0" y="105.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">free free win</text><text x="320" y="163" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">Vocabulary: free | meeting | win</text><line x1="320" y1="175" x2="160" y2="205" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="175" x2="480" y2="205" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="220" width="270" height="105" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="165.0" y="266.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Presence: (1, 0, 1)</text><text x="165.0" y="292.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Bernoulli: includes absence</text><rect x="340" y="220" width="270" height="105" rx="9" fill="#fff0d8" stroke="#d0e1da"/><text x="475.0" y="266.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Counts: (2, 0, 1)</text><text x="475.0" y="292.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Multinomial: token counts</text><text x="320" y="376" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">Counts score: log prior + 2 log p(free)</text><text x="320" y="409" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">+ log p(win)</text></g></svg>

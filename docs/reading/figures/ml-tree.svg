<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A useful question reduces uncertainty</title><desc id="desc">A balanced four-example parent splits into two pure two-example leaves. Weighted entropy drops from one bit to zero.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="420" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">A useful question reduces uncertainty</text><rect x="210" y="73" width="220" height="90" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="320.0" y="112.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">2 positive, 2 negative</text><text x="320.0" y="138.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">H = 1 bit</text><line x1="265" y1="163" x2="160" y2="230" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="375" y1="163" x2="480" y2="230" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><text x="183" y="199" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">yes</text><text x="431" y="199" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">no</text><rect x="35" y="244" width="250" height="78" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="160.0" y="277.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">2 positive</text><text x="160.0" y="303.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">H = 0</text><rect x="355" y="244" width="250" height="78" rx="9" fill="#fff0d8" stroke="#d0e1da"/><text x="480.0" y="277.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">2 negative</text><text x="480.0" y="303.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">H = 0</text><text x="320" y="379" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">Gain = 1 − (½ × 0 + ½ × 0) = 1 bit</text></g></svg>

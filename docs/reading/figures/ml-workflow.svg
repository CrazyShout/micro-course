<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Learn a procedure, then test it</title><desc id="desc">Split observations before fitting features. Training fits, validation selects, and held-out testing estimates performance; split drives to avoid near-duplicate frames.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="430" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Learn a procedure, then test it</text><rect x="205" y="70" width="230" height="57" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="320.0" y="105.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Raw observations</text><line x1="320" y1="127" x2="110" y2="164" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="127" x2="320" y2="164" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="127" x2="530" y2="164" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="174" width="170" height="105" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="110.0" y="220.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Train</text><text x="110.0" y="246.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">fit pipeline</text><rect x="235" y="174" width="170" height="105" rx="9" fill="#fff0d8" stroke="#d0e1da"/><text x="320.0" y="220.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Validate</text><text x="320.0" y="246.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">choose settings</text><rect x="445" y="174" width="170" height="105" rx="9" fill="#e9eef6" stroke="#d0e1da"/><text x="530.0" y="220.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Test</text><text x="530.0" y="246.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">final estimate</text><text x="320" y="325" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">Split by the intended generalization unit</text><text x="320" y="357" font-size="20" fill="#60777a" text-anchor="middle" font-weight="400">Example: a new drive, not a neighboring frame</text></g></svg>

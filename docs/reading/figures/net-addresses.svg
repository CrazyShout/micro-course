<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-labelledby="title desc"><title id="title">A remote fetch, one dependency at a time</title><desc id="desc">Assume remote DNS and web server, IPv4 Ethernet, empty caches, no NAT and cleartext HTTP/1.x. DHCP configuration precedes gateway ARP, DNS, TCP, and HTTP. IP destination changes with the target service, while the first-hop MAC is the gateway.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="530" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">A remote fetch, one dependency at a time</text><rect x="60" y="68" width="520" height="74" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="320.0" y="99.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">1  DHCP</text><text x="320.0" y="125.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Host IP, mask, gateway, DNS</text><line x1="320" y1="142" x2="320" y2="161" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="163" width="520" height="74" rx="9" fill="#edf1f6" stroke="#d0e1da"/><text x="320.0" y="194.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">2  ARP for gateway</text><text x="320.0" y="220.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Local next-hop MAC</text><line x1="320" y1="237" x2="320" y2="256" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="258" width="520" height="74" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="320.0" y="289.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">3  DNS</text><text x="320.0" y="315.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Website name → address</text><line x1="320" y1="332" x2="320" y2="351" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="353" width="520" height="74" rx="9" fill="#edf1f6" stroke="#d0e1da"/><text x="320.0" y="384.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">4  TCP → HTTP</text><text x="320.0" y="410.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Connection → resource request</text><text x="320" y="467" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">Frame destination = local gateway MAC</text><text x="320" y="499" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">IP destination = remote DNS / web server</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 505" role="img" aria-labelledby="title desc"><title id="title">Cache reuse has three paths</title><desc id="desc">With a stored response, policy-permitted fresh reuse avoids validation. Otherwise a validator can yield 304 with body reuse, or 200 with a changed representation. Unqualified no-cache requires validation even when fresh.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="505" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Cache reuse has three paths</text><rect x="165" y="68" width="310" height="55" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="320.0" y="102.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Stored response available</text><line x1="320" y1="123" x2="165" y2="155" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="123" x2="475" y2="155" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="173" width="265" height="77" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="162.5" y="205.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Fresh + policy permits</text><text x="162.5" y="231.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Reuse locally</text><rect x="345" y="173" width="265" height="77" rx="9" fill="#fff0d8" stroke="#d0e1da"/><text x="477.5" y="205.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Validation needed</text><text x="477.5" y="231.5" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Send a validator</text><line x1="460" y1="250" x2="220" y2="302" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><line x1="510" y1="250" x2="495" y2="302" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="319" width="245" height="78" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="202.5" y="352.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">304: unchanged</text><text x="202.5" y="378.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Reuse stored body</text><rect x="365" y="319" width="245" height="78" rx="9" fill="#fff0d8" stroke="#d0e1da"/><text x="487.5" y="352.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">200: changed</text><text x="487.5" y="378.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Replace with new body</text><text x="320" y="449" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">no-cache: validate before every reuse</text><text x="320" y="481" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">no-store: do not store in the cache</text></g></svg>

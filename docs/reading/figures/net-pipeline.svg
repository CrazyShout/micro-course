<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Three links, four packets</title><desc id="desc">Each stage takes 2 ms. Packet 1 finishes at 6 ms and packet 4 at 12 ms; successive links work on different packets simultaneously.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="360" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Three links, four packets</text><text x="26" y="127" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">Link 1</text><rect x="120" y="100" width="73" height="44" rx="5" fill="#087c75" stroke="#087c75"/><text x="156" y="129" font-size="20" fill="white" text-anchor="middle" font-weight="400">P1</text><rect x="197" y="100" width="73" height="44" rx="5" fill="#477791" stroke="#477791"/><text x="233" y="129" font-size="20" fill="white" text-anchor="middle" font-weight="400">P2</text><rect x="274" y="100" width="73" height="44" rx="5" fill="#a46517" stroke="#a46517"/><text x="310" y="129" font-size="20" fill="white" text-anchor="middle" font-weight="400">P3</text><rect x="351" y="100" width="73" height="44" rx="5" fill="#855c83" stroke="#855c83"/><text x="387" y="129" font-size="20" fill="white" text-anchor="middle" font-weight="400">P4</text><text x="26" y="193" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">Link 2</text><rect x="197" y="166" width="73" height="44" rx="5" fill="#087c75" stroke="#087c75"/><text x="233" y="195" font-size="20" fill="white" text-anchor="middle" font-weight="400">P1</text><rect x="274" y="166" width="73" height="44" rx="5" fill="#477791" stroke="#477791"/><text x="310" y="195" font-size="20" fill="white" text-anchor="middle" font-weight="400">P2</text><rect x="351" y="166" width="73" height="44" rx="5" fill="#a46517" stroke="#a46517"/><text x="387" y="195" font-size="20" fill="white" text-anchor="middle" font-weight="400">P3</text><rect x="428" y="166" width="73" height="44" rx="5" fill="#855c83" stroke="#855c83"/><text x="464" y="195" font-size="20" fill="white" text-anchor="middle" font-weight="400">P4</text><text x="26" y="259" font-size="20" fill="#17343b" text-anchor="start" font-weight="400">Link 3</text><rect x="274" y="232" width="73" height="44" rx="5" fill="#087c75" stroke="#087c75"/><text x="310" y="261" font-size="20" fill="white" text-anchor="middle" font-weight="400">P1</text><rect x="351" y="232" width="73" height="44" rx="5" fill="#477791" stroke="#477791"/><text x="387" y="261" font-size="20" fill="white" text-anchor="middle" font-weight="400">P2</text><rect x="428" y="232" width="73" height="44" rx="5" fill="#a46517" stroke="#a46517"/><text x="464" y="261" font-size="20" fill="white" text-anchor="middle" font-weight="400">P3</text><rect x="505" y="232" width="73" height="44" rx="5" fill="#855c83" stroke="#855c83"/><text x="541" y="261" font-size="20" fill="white" text-anchor="middle" font-weight="400">P4</text><text x="120" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">0</text><text x="197" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">2</text><text x="274" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">4</text><text x="351" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">6</text><text x="428" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">8</text><text x="505" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">10</text><text x="582" y="310" font-size="19" fill="#17343b" text-anchor="middle" font-weight="400">12</text><text x="320" y="342" font-size="20" fill="#60777a" text-anchor="middle" font-weight="400">Time (ms) · no propagation or queueing</text></g></svg>

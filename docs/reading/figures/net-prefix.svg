<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Most specific matching route wins</title><desc id="desc">Nested /8, /16, and /24 prefixes all contain 10.1.2.99. The /24 is the longest match. Shapes are schematic, not proportional to address counts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="430" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Most specific matching route wins</text><rect x="30" y="75" width="580" height="307" rx="9" fill="#e9eef6" stroke="#d0e1da"/><text x="55" y="109" font-size="23" fill="#17343b" text-anchor="start" font-weight="400">10.0.0.0/8</text><rect x="100" y="135" width="485" height="223" rx="9" fill="#fff0d8" stroke="#d0e1da"/><text x="125" y="171" font-size="23" fill="#17343b" text-anchor="start" font-weight="400">10.1.0.0/16</text><rect x="200" y="200" width="355" height="130" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="225" y="236" font-size="22" fill="#087c75" text-anchor="start" font-weight="700">10.1.2.0/24 → chosen</text><circle cx="240" cy="287" r="7" fill="#087c75" stroke="white" stroke-width="2"/><text x="260" y="295" font-size="23" fill="#17343b" text-anchor="start" font-weight="400">10.1.2.99</text><text x="320" y="414" font-size="19" fill="#60777a" text-anchor="middle" font-weight="400">Nested scopes, not address-space area to scale</text></g></svg>

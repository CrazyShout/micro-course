<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Same mean load; different waiting</title><desc id="desc">The bars show serialization intervals. Four uniformly spaced arrivals have no wait; a simultaneous burst waits 0,1,2,3 ms. Both patterns repeat every 8 ms.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="430" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Same mean load; different waiting</text><text x="30" y="91" font-size="21" fill="#087c75" text-anchor="start" font-weight="700">Even arrivals: 0, 2, 4, 6 ms</text><rect x="70" y="116" width="58" height="42" rx="4" fill="#087c75" stroke="#087c75"/><text x="99" y="144" font-size="20" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="190" y="116" width="58" height="42" rx="4" fill="#087c75" stroke="#087c75"/><text x="219" y="144" font-size="20" fill="white" text-anchor="middle" font-weight="400">2</text><rect x="310" y="116" width="58" height="42" rx="4" fill="#087c75" stroke="#087c75"/><text x="339" y="144" font-size="20" fill="white" text-anchor="middle" font-weight="400">3</text><rect x="430" y="116" width="58" height="42" rx="4" fill="#087c75" stroke="#087c75"/><text x="459" y="144" font-size="20" fill="white" text-anchor="middle" font-weight="400">4</text><text x="30" y="198" font-size="21" fill="#a46517" text-anchor="start" font-weight="700">Burst: four arrivals at 0 ms</text><rect x="70" y="222" width="58" height="42" rx="4" fill="#a46517" stroke="#a46517"/><text x="99" y="250" font-size="20" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="130" y="222" width="58" height="42" rx="4" fill="#a46517" stroke="#a46517"/><text x="159" y="250" font-size="20" fill="white" text-anchor="middle" font-weight="400">2</text><rect x="190" y="222" width="58" height="42" rx="4" fill="#a46517" stroke="#a46517"/><text x="219" y="250" font-size="20" fill="white" text-anchor="middle" font-weight="400">3</text><rect x="250" y="222" width="58" height="42" rx="4" fill="#a46517" stroke="#a46517"/><text x="279" y="250" font-size="20" fill="white" text-anchor="middle" font-weight="400">4</text><line x1="70" y1="290" x2="555" y2="290" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">0</text><text x="130" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">1</text><text x="190" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">2</text><text x="250" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">3</text><text x="310" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">4</text><text x="370" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">5</text><text x="430" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">6</text><text x="490" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">7</text><text x="550" y="316" font-size="18" fill="#17343b" text-anchor="middle" font-weight="400">8</text><text x="581" y="317" font-size="18" fill="#17343b" text-anchor="start" font-weight="400">ms</text><text x="320" y="363" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">Repeat every 8 ms: load = 4 / 8 = 0.5</text><text x="320" y="397" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">Mean wait: 0 ms (even) vs 1.5 ms (burst)</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Packet 1 is lost: what happens to 2 and 3?</title><desc id="desc">Packet zero arrives, packet one is lost, packets two and three arrive out of order. Basic GBN discards and later retransmits 1–3; SR buffers 2 and 3 and needs only 1 retransmitted under successful ACK delivery.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="440" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Packet 1 is lost: what happens to 2 and 3?</text><text x="30" y="90" font-size="22" fill="#17343b" text-anchor="start" font-weight="400">Already sent: 0, 1, 2, 3</text><rect x="30" y="117" width="280" height="228" rx="9" fill="#fff" stroke="#d0e1da"/><text x="170" y="154" font-size="25" fill="#a46517" text-anchor="middle" font-weight="700">GBN</text><rect x="51" y="195" width="49" height="44" rx="5" fill="#edf1ef" stroke="#d0e1da"/><text x="75" y="224" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">0</text><rect x="111" y="195" width="49" height="44" rx="5" fill="#fee9e6" stroke="#d0e1da"/><text x="135" y="224" font-size="22" fill="#b04e4b" text-anchor="middle" font-weight="400">×</text><rect x="171" y="195" width="49" height="44" rx="5" fill="#edf1ef" stroke="#d0e1da"/><text x="195" y="224" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">2</text><rect x="231" y="195" width="49" height="44" rx="5" fill="#edf1ef" stroke="#d0e1da"/><text x="255" y="224" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">3</text><text x="170" y="276" font-size="20" fill="#a46517" text-anchor="middle" font-weight="400">Discard out of order</text><text x="170" y="314" font-size="22" fill="#a46517" text-anchor="middle" font-weight="700">Resend: 1, 2, 3</text><rect x="340" y="117" width="280" height="228" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="480" y="154" font-size="25" fill="#087c75" text-anchor="middle" font-weight="700">SR</text><rect x="361" y="195" width="49" height="44" rx="5" fill="#edf1ef" stroke="#d0e1da"/><text x="385" y="224" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">0</text><rect x="421" y="195" width="49" height="44" rx="5" fill="#fee9e6" stroke="#d0e1da"/><text x="445" y="224" font-size="22" fill="#b04e4b" text-anchor="middle" font-weight="400">×</text><rect x="481" y="195" width="49" height="44" rx="5" fill="#edf1ef" stroke="#d0e1da"/><text x="505" y="224" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">2</text><rect x="541" y="195" width="49" height="44" rx="5" fill="#edf1ef" stroke="#d0e1da"/><text x="565" y="224" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">3</text><text x="480" y="276" font-size="20" fill="#087c75" text-anchor="middle" font-weight="400">Buffer + acknowledge</text><text x="480" y="314" font-size="22" fill="#087c75" text-anchor="middle" font-weight="700">Resend: 1</text><text x="320" y="383" font-size="20" fill="#60777a" text-anchor="middle" font-weight="400">Assume ACKs arrive; no additional loss.</text><text x="320" y="415" font-size="20" fill="#60777a" text-anchor="middle" font-weight="400">Saving transmissions requires receiver state.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445" role="img" aria-labelledby="title desc"><title id="title">Shortest path: A → B → C → D</title><desc id="desc">An undirected graph has AB=2, AC=5, BC=1, BD=4, CD=1. The highlighted A-B-C-D shortest path costs four. A next hop is B, while D predecessor is C.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="445" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Shortest path: A → B → C → D</text><line x1="80" y1="200" x2="230" y2="110" stroke="#087c75" stroke-width="5"/><rect x="139.0" y="137.0" width="32" height="30" rx="3" fill="#fafcfb" stroke="#fafcfb"/><text x="155.0" y="160.0" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">2</text><line x1="80" y1="200" x2="400" y2="245" stroke="#b6c7c1" stroke-width="2"/><rect x="224.0" y="204.5" width="32" height="30" rx="3" fill="#fafcfb" stroke="#fafcfb"/><text x="240.0" y="227.5" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">5</text><line x1="230" y1="110" x2="400" y2="245" stroke="#087c75" stroke-width="5"/><rect x="299.0" y="159.5" width="32" height="30" rx="3" fill="#fafcfb" stroke="#fafcfb"/><text x="315.0" y="182.5" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">1</text><line x1="230" y1="110" x2="550" y2="140" stroke="#b6c7c1" stroke-width="2"/><rect x="374.0" y="107.0" width="32" height="30" rx="3" fill="#fafcfb" stroke="#fafcfb"/><text x="390.0" y="130.0" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">4</text><line x1="400" y1="245" x2="550" y2="140" stroke="#087c75" stroke-width="5"/><rect x="459.0" y="174.5" width="32" height="30" rx="3" fill="#fafcfb" stroke="#fafcfb"/><text x="475.0" y="197.5" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">1</text><circle cx="80" cy="200" r="28" fill="#17343b" stroke="white" stroke-width="2"/><text x="80" y="208" font-size="24" fill="white" text-anchor="middle" font-weight="700">A</text><circle cx="230" cy="110" r="28" fill="#17343b" stroke="white" stroke-width="2"/><text x="230" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="700">B</text><circle cx="400" cy="245" r="28" fill="#17343b" stroke="white" stroke-width="2"/><text x="400" y="253" font-size="24" fill="white" text-anchor="middle" font-weight="700">C</text><circle cx="550" cy="140" r="28" fill="#17343b" stroke="white" stroke-width="2"/><text x="550" y="148" font-size="24" fill="white" text-anchor="middle" font-weight="700">D</text><text x="320" y="323" font-size="23" fill="#087c75" text-anchor="middle" font-weight="700">Cost = 2 + 1 + 1 = 4</text><text x="320" y="367" font-size="21" fill="#17343b" text-anchor="middle" font-weight="400">A forwards to B; D has predecessor C.</text><text x="320" y="409" font-size="20" fill="#60777a" text-anchor="middle" font-weight="400">Different tables answer different questions.</text></g></svg>

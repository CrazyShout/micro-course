<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Received does not mean consumed</title><desc id="desc">Eight one-kB slots contain five kB of unread data and three kB free. Application consumption frees buffer space; ACK progress and buffer occupancy are different quantities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60777a"/></marker></defs><rect width="640" height="420" fill="#fafcfb"/><g font-family="Arial, sans-serif"><text x="28" y="39" font-size="25" fill="#17343b" text-anchor="start" font-weight="700">Received does not mean consumed</text><text x="320" y="92" font-size="23" fill="#17343b" text-anchor="middle" font-weight="400">Receiver buffer: 8 kB</text><rect x="48" y="119" width="64" height="85" rx="6" fill="#087c75" stroke="#087c75"/><text x="80" y="170" font-size="22" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="116" y="119" width="64" height="85" rx="6" fill="#087c75" stroke="#087c75"/><text x="148" y="170" font-size="22" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="184" y="119" width="64" height="85" rx="6" fill="#087c75" stroke="#087c75"/><text x="216" y="170" font-size="22" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="252" y="119" width="64" height="85" rx="6" fill="#087c75" stroke="#087c75"/><text x="284" y="170" font-size="22" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="320" y="119" width="64" height="85" rx="6" fill="#087c75" stroke="#087c75"/><text x="352" y="170" font-size="22" fill="white" text-anchor="middle" font-weight="400">1</text><rect x="388" y="119" width="64" height="85" rx="6" fill="#fff" stroke="#087c75"/><text x="420" y="170" font-size="22" fill="#087c75" text-anchor="middle" font-weight="400">1</text><rect x="456" y="119" width="64" height="85" rx="6" fill="#fff" stroke="#087c75"/><text x="488" y="170" font-size="22" fill="#087c75" text-anchor="middle" font-weight="400">1</text><rect x="524" y="119" width="64" height="85" rx="6" fill="#fff" stroke="#087c75"/><text x="556" y="170" font-size="22" fill="#087c75" text-anchor="middle" font-weight="400">1</text><text x="213" y="241" font-size="22" fill="#087c75" text-anchor="middle" font-weight="400">Unread: 5 kB</text><text x="491" y="241" font-size="22" fill="#17343b" text-anchor="middle" font-weight="400">Free: 3 kB</text><line x1="185" y1="259" x2="185" y2="310" stroke="#60777a" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="321" width="267" height="58" rx="9" fill="#e6f2ee" stroke="#d0e1da"/><text x="187.5" y="357.0" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">Application reads bytes</text><text x="458" y="305" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">ACK tracks arrival.</text><text x="458" y="338" font-size="20" fill="#17343b" text-anchor="middle" font-weight="400">rwnd protects space.</text></g></svg>
